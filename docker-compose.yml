# EvidenceLens — application services.
#
# Apps only. The data plane (postgres / nats / redis / meili / milvus / neo4j)
# lives in docker-compose.data.yml so production can swap it for an external
# host (e.g. TrueNAS) by simply omitting that file.
#
# Usage:
#   npm run up                         # default: app stack + data plane (data file pulled in via npm script)
#   npm run up:full                    # default + ingest + observability profiles
#   npm run up:prod                    # apps only + prod overlay (external data plane)
#   docker compose --profile ingest run --rm ingester-pubmed
#   docker compose --profile test run --rm smoke
#
# All optional dependencies (Turnstile, OTel, Sentry, PostHog) degrade
# to no-op when their env vars are blank. See .env.example.

name: evidencelens

networks:
  evidencelens:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  ofelia_config:

# ---------------------------------------------------------------------
# YAML anchors for shared config
# ---------------------------------------------------------------------
x-app-env: &app-env
  POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  POSTGRES_DB:   ${POSTGRES_DB:-evidencelens}
  POSTGRES_USER: ${POSTGRES_USER:-evidencelens}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme-dev-only}
  DATABASE_URL: postgres://${POSTGRES_USER:-evidencelens}:${POSTGRES_PASSWORD:-changeme-dev-only}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-evidencelens}
  NATS_URL:     ${NATS_URL:-nats://nats:4222}
  NATS_STREAM:  ${NATS_STREAM:-EVIDENCELENS}
  NATS_SUBJECT_RAW_DOCS: ${NATS_SUBJECT_RAW_DOCS:-raw-docs}
  NATS_SUBJECT_CITATION_EDGES: ${NATS_SUBJECT_CITATION_EDGES:-citation-edges}
  REDIS_HOST:   ${REDIS_HOST:-redis}
  REDIS_PORT:   ${REDIS_PORT:-6379}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  REDIS_DB:     ${REDIS_DB:-0}
  MEILI_URL:    ${MEILI_URL:-http://meilisearch:7700}
  MEILI_KEY:    ${MEILI_KEY:-dev-master-key}
  MILVUS_URI:   ${MILVUS_URI:-http://milvus:19530}
  MILVUS_TOKEN: ${MILVUS_TOKEN:-}
  NEO4J_URL:    ${NEO4J_URL:-bolt://neo4j:7687}
  NEO4J_USER:   ${NEO4J_USER:-neo4j}
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme-dev-only}
  S3_ENDPOINT:  ${S3_ENDPOINT:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  S3_BUCKET:    ${S3_BUCKET:-evidencelens-raw}
  S3_BUCKET_WEBLLM: ${S3_BUCKET_WEBLLM:-evidencelens-webllm}
  S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
  EMBEDDER_GRPC_URL: ${EMBEDDER_GRPC_URL:-embedder:50051}
  # The processor calls the embedder over HTTP (the gRPC path was never built).
  # Co-located default derives http://embedder:8080 from EMBEDDER_GRPC_URL. When
  # the embedder is on another host, set EMBEDDER_HTTP_URL to its PUBLISHED HTTP
  # port — TrueNAS maps 8091:8080, so working-PC/VPS use http://<TRUENAS_IP>:8091.
  # Default empty => client derives the co-located URL.
  EMBEDDER_HTTP_URL: ${EMBEDDER_HTTP_URL:-}
  SCORER_GRPC_URL:   ${SCORER_GRPC_URL:-scorer:50052}
  # The gateway calls the scorer over HTTP/SSE (NOT gRPC) for search/readyz.
  # Must be injected here (the gateway reads process.env.SCORER_HTTP_URL); a
  # bare line in .env is only used for ${...} substitution and never reaches
  # the container. On the VPS set SCORER_HTTP_URL=http://<TRUENAS_IP>:8090.
  SCORER_HTTP_URL:   ${SCORER_HTTP_URL:-http://scorer:8090}
  # Historical backfill (date-windowed ingesters). BACKFILL=1 makes a capped run
  # advance the watermark to the LATEST item seen (resume mid-history next run)
  # instead of jumping to today and skipping the gap. BACKFILL_SINCE seeds the
  # first run's start date/year. Default off => normal incremental ingest.
  BACKFILL:          ${BACKFILL:-}
  BACKFILL_SINCE:    ${BACKFILL_SINCE:-}
  # BGE-M3 = 1024-d, same on GPU and CPU. Matches the Milvus evidence_v1
  # collection + the indexer/scorer defaults. Do not change per-host.
  EMBEDDING_DIM:     ${EMBEDDING_DIM:-1024}
  # Optional. Empty => disabled. See .env.example "OPTIONAL" section.
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
  TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
  INTERNAL_TOKEN:   ${INTERNAL_TOKEN:-}

x-app-defaults: &app-defaults
  restart: unless-stopped
  networks: [evidencelens]

# ---------------------------------------------------------------------
# Services
# ---------------------------------------------------------------------
services:

  # =========================================================
  # Application services (default profile)
  #
  # No depends_on for data services here — each app retries on its own,
  # and keeping them out of depends_on lets this file run cleanly with
  # OR without docker-compose.data.yml stacked on top.
  # =========================================================
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    image: evidencelens-gateway:local
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: gateway
      AGENT_URL: ${AGENT_URL:-http://agent:8081/synthesize}
      # The gateway relays the public /mcp endpoint to the internal mcp-server
      # (Docker service name) so MCP works through the single public domain with
      # no extra Traefik route. On the VPS both run in the same compose project.
      MCP_SERVER_URL: ${MCP_SERVER_URL:-http://mcp-server:8082}
      GATEWAY_PORT: ${GATEWAY_PORT:-8080}
    ports: ["8088:8080"]
    <<: *app-defaults

  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    image: evidencelens-agent:local
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: agent
      AGENT_PORT: ${AGENT_PORT:-8081}
      AGENT_PROMPT_PATH: /prompts/agent_system.md
    ports: ["8089:8081"]
    <<: *app-defaults

  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    image: evidencelens-mcp:local
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: mcp-server
      MCP_TRANSPORT: http
      MCP_PORT: ${MCP_PORT:-8082}
      GATEWAY_URL: ${GATEWAY_URL_INTERNAL:-http://gateway:8080}
    ports: ["8082:8082"]
    <<: *app-defaults

  processor:
    # Root build context (like the agent service) so the image can include
    # repo-root files the processor needs at runtime: config/ (predatory ISSN
    # list) and infra/scripts/ (enrich_citations.py, run as a scheduled job).
    build:
      context: .
      dockerfile: process/Dockerfile
    image: evidencelens-processor:local
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: processor
      # scispaCy UMLS entity-linker loads ~3-4GB and OOM-kills the processor
      # under the memory cap, wedging the pipeline. OFF by default (regex
      # fallback). Set to 1 AND raise the memory limit below to enable.
      ENABLE_UMLS_LINKER: ${ENABLE_UMLS_LINKER:-}
      # Pipeline concurrency. Raise on a beefy working PC to drain the NATS
      # backlog faster (e.g. 200); keep modest on constrained hosts.
      MAX_CONCURRENT_PIPELINES: ${MAX_CONCURRENT_PIPELINES:-50}
    deploy:
      resources:
        # Env-driven so you can dedicate more of the working PC when it's free
        # (e.g. PROCESSOR_CPUS=12 PROCESSOR_MEMORY=24G) and dial back otherwise.
        limits:
          cpus: "${PROCESSOR_CPUS:-2}"
          memory: ${PROCESSOR_MEMORY:-4G}
    <<: *app-defaults

  indexer:
    build:
      context: ./index
      dockerfile: Dockerfile
    image: evidencelens-indexer:local
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: indexer
    <<: *app-defaults

  scorer:
    build:
      context: ./scorer
      dockerfile: Dockerfile
    image: evidencelens-scorer:local
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: scorer
    ports: ["50052:50052", "8090:8090"]
    <<: *app-defaults

  embedder:
    build:
      context: ./embedder
      dockerfile: Dockerfile
    image: evidencelens-embedder:local
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: embedder
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
      BATCH_SIZE: ${EMBEDDER_BATCH_SIZE:-32}
      MAX_WAIT_MS: ${EMBEDDER_MAX_WAIT_MS:-25}
    ports:
      - "50051:50051"
      - "8091:8080"
    # No GPU reservation here on purpose: this base def must run on CPU-only
    # hosts (TrueNAS). A reservations.devices[nvidia] block hard-fails compose
    # when no NVIDIA runtime is present. GPU is added by the workingpc overlay
    # (which has the GPU); set EMBEDDING_DEVICE=cuda there.
    <<: *app-defaults

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: evidencelens-frontend:local
    environment:
      NODE_ENV: production
      GATEWAY_URL: ${GATEWAY_URL_INTERNAL:-http://gateway:8080}
      NEXT_PUBLIC_GATEWAY_URL: ${NEXT_PUBLIC_GATEWAY_URL:-http://gateway:8080}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://gateway:8080/ws}
      NEXT_PUBLIC_WEBLLM_URL: ${NEXT_PUBLIC_WEBLLM_URL:-}
      NEXT_PUBLIC_SITE_URL:   ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      # Optional. Blank = disabled.
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
      NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    ports: ["3000:3000"]
    <<: *app-defaults

  # Open Payments /lookup HTTP server. Unlike the other ingesters this is
  # long-running (default profile): the processor's author-payment-joiner
  # calls it per author to populate COI badges. The annual bulk CSV load is
  # triggered out-of-band by POSTing /run. Must keep the service name
  # `ingester-open-payments` — the processor defaults to that host.
  ingester-open-payments:
    build:
      context: ./ingest
      dockerfile: cmd/ingester-open-payments/Dockerfile
    image: evidencelens-ingester-open-payments:local
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: ingester-open-payments
      PORT: "8080"
      # Annual CMS bulk dataset URL (.csv or .zip); the ofelia open-payments-bulk
      # job reads this to POST /run. Empty = COI stays a no-op (table never loads).
      OPENPAYMENTS_BULK_URL: ${OPENPAYMENTS_BULK_URL:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    <<: *app-defaults

  # =========================================================
  # Scheduler (default profile)
  # =========================================================
  # Renders config.ini.tmpl -> config.ini (envsubst) into a shared volume,
  # then exits. ofelia can't interpolate ${VAR} itself and job-run
  # containers don't inherit ofelia's env, so values are baked in here.
  ofelia-config:
    image: alpine:3.20
    # Command is inlined (not a mounted .sh) so a CRLF checkout on Windows
    # can't break `sh`. The template is stripped of any \r before envsubst
    # for the same reason. envsubst only touches the listed vars, leaving
    # ofelia's own `$$POSTGRES_*` escapes intact.
    entrypoint:
      - sh
      - -c
      - >
        apk add --no-cache gettext >/dev/null &&
        tr -d '\r' < /tmpl/config.ini.tmpl |
        envsubst '$$NCBI_API_KEY $$NCBI_TOOL $$NCBI_EMAIL $$OPENFDA_API_KEY $$NATS_URL $$DATABASE_URL $$S3_ENDPOINT $$S3_ACCESS_KEY_ID $$S3_SECRET_ACCESS_KEY $$S3_BUCKET $$OPENPAYMENTS_BULK_URL'
        > /out/config.ini &&
        echo "ofelia config rendered to /out/config.ini"
    environment:
      <<: *app-env
      NCBI_API_KEY: ${NCBI_API_KEY:-}
      NCBI_TOOL: ${NCBI_TOOL:-evidencelens}
      NCBI_EMAIL: ${NCBI_EMAIL:-}
      OPENFDA_API_KEY: ${OPENFDA_API_KEY:-}
      # CMS Open Payments annual General-Payment dataset (.csv or .zip). Set in
      # .env to enable COI badges. Link: https://openpaymentsdata.cms.gov/datasets
      OPENPAYMENTS_BULK_URL: ${OPENPAYMENTS_BULK_URL:-}
    volumes:
      - ./infra/ofelia/config.ini.tmpl:/tmpl/config.ini.tmpl:ro
      - ofelia_config:/out
    networks: [evidencelens]
    restart: "no"

  # ofelia execs the ingesters + jobs on cron schedules
  # defined in infra/ofelia/config.ini (rendered by ofelia-config).
  ofelia:
    image: mcuadros/ofelia:latest
    command: ["daemon", "--config=/etc/ofelia/config.ini"]
    depends_on:
      ofelia-config:
        condition: service_completed_successfully
    volumes:
      - ofelia_config:/etc/ofelia:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    <<: *app-defaults

  # =========================================================
  # Ingesters (--profile ingest)
  # One-shot containers. ofelia triggers them on schedule;
  # `docker compose --profile ingest run --rm ingester-X` for ad-hoc.
  # =========================================================
  ingester-pubmed:
    profiles: ["ingest"]
    build:
      context: ./ingest
      dockerfile: cmd/ingester-pubmed/Dockerfile
    image: evidencelens-ingester-pubmed:local
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: ingester-pubmed
      NCBI_API_KEY: ${NCBI_API_KEY:-}
      NCBI_TOOL: ${NCBI_TOOL:-evidencelens}
      NCBI_EMAIL: ${NCBI_EMAIL:-}
      PUBMED_MAX_PER_RUN: ${PUBMED_MAX_PER_RUN:-}
    networks: [evidencelens]
    restart: "no"

  ingester-trials:
    profiles: ["ingest"]
    build:
      context: ./ingest
      dockerfile: cmd/ingester-trials/Dockerfile
    image: evidencelens-ingester-trials:local
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: ingester-trials
    networks: [evidencelens]
    restart: "no"

  ingester-fda:
    profiles: ["ingest"]
    build:
      context: ./ingest
      dockerfile: cmd/ingester-fda/Dockerfile
    image: evidencelens-ingester-fda:local
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: ingester-fda
      OPENFDA_API_KEY: ${OPENFDA_API_KEY:-}
    networks: [evidencelens]
    restart: "no"

  ingester-preprint:
    profiles: ["ingest"]
    build:
      context: ./ingest
      dockerfile: cmd/ingester-preprint/Dockerfile
    image: evidencelens-ingester-preprint:local
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: ingester-preprint
    networks: [evidencelens]
    restart: "no"

  ingester-openalex:
    profiles: ["ingest"]
    build:
      context: ./ingest
      dockerfile: cmd/ingester-openalex/Dockerfile
    image: evidencelens-ingester-openalex:local
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: ingester-openalex
      # REST delta path by default (bulk S3 path needs AWS creds for the public
      # OpenAlex bucket). Override to "true" only for a full bulk backfill.
      OPENALEX_USE_BULK: ${OPENALEX_USE_BULK:-false}
    networks: [evidencelens]
    restart: "no"

  # Crossref is a DOI-ENRICHMENT ingester, not a bulk/delta fetcher. It looks up
  # one DOI at a time (CROSSREF_DOI=...) or drains a batch from the
  # crossref_enrich_queue table the processor populates. No MAX_PER_RUN knob.
  ingester-crossref:
    profiles: ["ingest"]
    build:
      context: ./ingest
      dockerfile: cmd/ingester-crossref/Dockerfile
    image: evidencelens-ingester-crossref:local
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: ingester-crossref
      UNPAYWALL_EMAIL: ${UNPAYWALL_EMAIL:-contact@example.com}
    networks: [evidencelens]
    restart: "no"

  ingester-nih-reporter:
    profiles: ["ingest"]
    build:
      context: ./ingest
      dockerfile: cmd/ingester-nih-reporter/Dockerfile
    image: evidencelens-ingester-nih-reporter:local
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: ingester-nih-reporter
    networks: [evidencelens]
    restart: "no"

  ingester-chembl:
    profiles: ["ingest"]
    build:
      context: ./ingest
      dockerfile: cmd/ingester-chembl/Dockerfile
    image: evidencelens-ingester-chembl:local
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: ingester-chembl
    networks: [evidencelens]
    restart: "no"

  ingester-nsf:
    profiles: ["ingest"]
    build:
      context: ./ingest
      dockerfile: cmd/ingester-nsf/Dockerfile
    image: evidencelens-ingester-nsf:local
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: ingester-nsf
    networks: [evidencelens]
    restart: "no"

  ingester-hpo:
    profiles: ["ingest"]
    build:
      context: ./ingest
      dockerfile: cmd/ingester-hpo/Dockerfile
    image: evidencelens-ingester-hpo:local
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: ingester-hpo
    networks: [evidencelens]
    restart: "no"

  ingester-europepmc:
    profiles: ["ingest"]
    build:
      context: ./ingest
      dockerfile: cmd/ingester-europepmc/Dockerfile
    image: evidencelens-ingester-europepmc:local
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: ingester-europepmc
    networks: [evidencelens]
    restart: "no"

  # CORE needs a free API key (CORE_API_KEY); skips its run when unset.
  ingester-core:
    profiles: ["ingest"]
    build:
      context: ./ingest
      dockerfile: cmd/ingester-core/Dockerfile
    image: evidencelens-ingester-core:local
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: ingester-core
      CORE_API_KEY: ${CORE_API_KEY:-}
    networks: [evidencelens]
    restart: "no"

  # Unpaywall is per-DOI OA enrichment; requires a real contact email.
  ingester-unpaywall:
    profiles: ["ingest"]
    build:
      context: ./ingest
      dockerfile: cmd/ingester-unpaywall/Dockerfile
    image: evidencelens-ingester-unpaywall:local
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: ingester-unpaywall
      UNPAYWALL_EMAIL: ${UNPAYWALL_EMAIL:-contact@example.com}
    networks: [evidencelens]
    restart: "no"

  # Semantic Scholar: SEMANTIC_SCHOLAR_API_KEY (optional) raises rate limits.
